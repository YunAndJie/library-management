<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线图书管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ======================== Login Overlay ======================== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <h2>📚 图书管理系统</h2>
            <div style="display:flex;justify-content:center;gap:20px;margin-bottom:20px">
                <a class="auth-tab" id="tab-login" style="font-weight:700;cursor:pointer;font-size:15px" onclick="toggleAuthTab('login')">登录</a>
                <a class="auth-tab" id="tab-register" style="font-weight:400;cursor:pointer;font-size:15px" onclick="toggleAuthTab('register')">注册</a>
            </div>
            <div class="auth-form" id="form-login">
                <div class="form-group"><label>用户名</label><input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username"></div>
                <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password"></div>
                <button class="btn btn-primary btn-block" onclick="handleLogin()">登 录</button>
            </div>
            <div class="auth-form" id="form-register" style="display:none">
                <div class="form-group"><label>用户名</label><input type="text" id="regUsername" placeholder="3-20位字母数字下划线"></div>
                <div class="form-group"><label>邮箱</label><input type="email" id="regEmail" placeholder="请输入邮箱"></div>
                <div class="form-group"><label>密码</label><input type="password" id="regPassword" placeholder="至少6位，含字母和数字"></div>
                <div class="form-group"><label>确认密码</label><input type="password" id="regConfirm" placeholder="再次输入密码"></div>
                <button class="btn btn-primary btn-block" onclick="handleRegister()">注 册</button>
            </div>
        </div>
    </div>

    <!-- ======================== Main Layout ======================== -->
    <div class="layout" id="layout">
        <nav class="sidebar">
            <div class="sidebar-header">📖 图书管理系统</div>
            <ul class="sidebar-menu">
                <li class="active" id="menu-dashboard" onclick="switchPage('dashboard')"><span class="icon">📊</span><span>仪表盘</span></li>
                <li id="menu-books" onclick="switchPage('books')"><span class="icon">📚</span><span>图书管理</span></li>
                <li id="menu-categories" onclick="switchPage('categories')"><span class="icon">📂</span><span>分类管理</span></li>
                <li id="menu-borrow" onclick="switchPage('borrow')"><span class="icon">📋</span><span>借阅管理</span></li>
                <li id="menu-users" onclick="switchPage('users')"><span class="icon">👥</span><span>用户管理</span></li>
            </ul>
        </nav>
        <main class="main">
            <header class="header">
                <h1 id="pageTitle">仪表盘</h1>
                <div class="user-info">
                    <span>👤 <span id="headerUsername"></span></span>
                    <span class="tag tag-info" id="headerRole"></span>
                    <button class="btn btn-sm btn-danger" onclick="handleLogout()">退出</button>
                </div>
            </header>

            <!-- Dashboard -->
            <div class="content active" id="page-dashboard">
                <div class="stats-grid">
                    <div class="stat-card c1"><div class="num" id="stat-users">0</div><div class="label">用户总数</div></div>
                    <div class="stat-card c2"><div class="num" id="stat-books">0</div><div class="label">图书总数</div></div>
                    <div class="stat-card c3"><div class="num" id="stat-cats">0</div><div class="label">分类总数</div></div>
                    <div class="stat-card c4"><div class="num" id="stat-borrows">0</div><div class="label">借阅总数</div></div>
                </div>
                <div class="card"><div class="card-header"><h3>快捷操作</h3></div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap">
                        <button class="btn btn-primary" onclick="switchPage('books')">📚 管理图书</button>
                        <button class="btn btn-success" onclick="switchPage('borrow')">📋 管理借阅</button>
                        <button class="btn btn-warning" onclick="switchPage('categories')">📂 管理分类</button>
                        <button class="btn btn-info" onclick="switchPage('users')" style="background:#909399;color:#fff">👥 管理用户</button>
                    </div>
                </div>
            </div>

            <!-- Books Page -->
            <div class="content" id="page-books">
                <div class="card">
                    <div class="card-header"><h3>图书列表</h3><button class="btn btn-primary" onclick="showBookModal()">+ 添加图书</button></div>
                    <div class="toolbar">
                        <input type="text" id="bookSearch" placeholder="搜索书名或作者...">
                        <button class="btn btn-primary btn-sm" onclick="searchBooks()">搜索</button>
                        <button class="btn btn-sm" onclick="loadBooks()" style="background:#f5f7fa">刷新</button>
                    </div>
                    <div class="table-wrap">
                        <table><thead><tr><th>ID</th><th>书名</th><th>作者</th><th>ISBN</th><th>价格</th><th>库存</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
                        <tbody id="booksTableBody"></tbody></table>
                    </div>
                </div>
            </div>

            <!-- Categories Page -->
            <div class="content" id="page-categories">
                <div class="card">
                    <div class="card-header"><h3>分类树</h3><button class="btn btn-primary" onclick="showCategoryModal()">+ 添加分类</button></div>
                    <div id="categoryTree"></div>
                </div>
            </div>

            <!-- Borrow Page -->
            <div class="content" id="page-borrow">
                <div class="card">
                    <div class="card-header"><h3>借阅记录</h3><button class="btn btn-primary" onclick="showBorrowModal()">+ 借阅图书</button></div>
                    <div class="table-wrap">
                        <table><thead><tr><th>ID</th><th>用户</th><th>图书</th><th>借阅时间</th><th>到期时间</th><th>归还时间</th><th>状态</th><th>超期</th><th>操作</th></tr></thead>
                        <tbody id="borrowTableBody"></tbody></table>
                    </div>
                </div>
            </div>

            <!-- Users Page -->
            <div class="content" id="page-users">
                <div class="card">
                    <div class="card-header"><h3>用户列表</h3></div>
                    <div class="table-wrap">
                        <table><thead><tr><th>ID</th><th>用户名</th><th>邮箱</th><th>手机</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
                        <tbody id="usersTableBody"></tbody></table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ======================== Book Modal ======================== -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <h3 id="bookModalTitle">添加图书</h3>
            <form id="bookForm">
                <input type="hidden" id="editBookId">
                <div class="form-group"><label>ISBN *</label><input type="text" id="bookIsbn"></div>
                <div class="form-group"><label>书名 *</label><input type="text" id="bookTitle"></div>
                <div class="form-group"><label>作者 *</label><input type="text" id="bookAuthor"></div>
                <div class="form-group"><label>出版社</label><input type="text" id="bookPublisher"></div>
                <div class="form-group"><label>分类</label><select id="bookCategory"></select></div>
                <div class="form-group"><label>价格</label><input type="number" id="bookPrice" step="0.01"></div>
                <div class="form-group"><label>库存</label><input type="number" id="bookStock"></div>
                <div class="form-group"><label>封面URL</label><input type="text" id="bookCover"></div>
                <div class="form-group"><label>描述</label><input type="text" id="bookDesc"></div>
            </form>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
                <button class="btn" onclick="closeBookModal()">取消</button>
                <button class="btn btn-primary" onclick="saveBook()">保存</button>
            </div>
        </div>
    </div>

    <!-- ======================== Category Modal ======================== -->
    <div class="modal-overlay" id="catModal">
        <div class="modal">
            <h3 id="catModalTitle">添加分类</h3>
            <form id="catForm">
                <input type="hidden" id="editCatId">
                <div class="form-group"><label>分类名称 *</label><input type="text" id="catName"></div>
                <div class="form-group"><label>描述</label><input type="text" id="catDesc"></div>
                <div class="form-group"><label>父分类</label><select id="catParent"></select></div>
                <div class="form-group"><label>排序</label><input type="number" id="catSort" value="0"></div>
            </form>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
                <button class="btn" onclick="closeCatModal()">取消</button>
                <button class="btn btn-primary" onclick="saveCategory()">保存</button>
            </div>
        </div>
    </div>

    <!-- ======================== Borrow Modal ======================== -->
    <div class="modal-overlay" id="borrowModal">
        <div class="modal">
            <h3>借阅图书</h3>
            <form>
                <div class="form-group"><label>用户ID *</label><input type="number" id="borrowUserId" placeholder="请输入用户ID"></div>
                <div class="form-group"><label>图书ID *</label><input type="number" id="borrowBookId" placeholder="请输入图书ID"></div>
                <div class="form-group"><label>借阅天数</label><input type="number" id="borrowDays" value="30"></div>
            </form>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
                <button class="btn" onclick="closeBorrowModal()">取消</button>
                <button class="btn btn-primary" onclick="handleBorrow()">确认借阅</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
